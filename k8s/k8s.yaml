apiVersion: v1
kind: ConfigMap
metadata:
  name: order-configmap
  labels:
    app: order
data:
  EXCHANGE_SERVICE_URL: "http://exchange:8080/exchanges/{from_currency}/{to_currency}"
  PRODUCT_SERVICE_URL: "http://product:8080/products/{id_product}"
  EXCHANGE_CACHE_TTL_SECONDS: "60"
  EXCHANGE_REQUEST_TIMEOUT_SECONDS: "5"
  PRODUCT_REQUEST_TIMEOUT_SECONDS: "5"
---
apiVersion: v1
kind: Secret
metadata:
  name: order-secrets
  labels:
    app: order
type: Opaque
stringData:
  DATABASE_URL: "postgresql+asyncpg://order_user:order_pass@order-db:5432/order_db"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: order
  labels:
    app: order
spec:
  replicas: 1
  selector:
    matchLabels:
      app: order
  template:
    metadata:
      labels:
        app: order
    spec:
      containers:
        - name: order
          image: projetomicro/order:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: order-configmap
            - secretRef:
                name: order-secrets
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "500m"
---
apiVersion: v1
kind: Service
metadata:
  name: order
  labels:
    app: order
spec:
  type: ClusterIP
  ports:
    - port: 8080
      targetPort: 8080
  selector:
    app: order
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: order-db
  labels:
    app: order-db
spec:
  replicas: 1
  selector:
    matchLabels:
      app: order-db
  template:
    metadata:
      labels:
        app: order-db
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: order_db
            - name: POSTGRES_USER
              value: order_user
            - name: POSTGRES_PASSWORD
              value: order_pass
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "500m"
---
apiVersion: v1
kind: Service
metadata:
  name: order-db
  labels:
    app: order-db
spec:
  type: ClusterIP
  ports:
    - port: 5432
      targetPort: 5432
  selector:
    app: order-db
